# Watchlist: the conferences this tracker follows.
#
#   id:       unique key (also used to match entries in data/manual.yml)
#   source:   path in ccfddl/ccf-deadlines `conference/` dir (without .yml),
#             or `manual` if the data lives only in data/manual.yml
#   category: EDA | Architecture | AI
#   tier:     top | notable   (the site shows "top" by default)
#
# To add a conference, find its file at
#   https://github.com/ccfddl/ccf-deadlines/tree/main/conference
# and append an entry below.

